[project]
name = "saveclock-api"
version = "0.1.0"
description = "SaveClock API and workers"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.14.0",
    "asyncpg>=0.32.0",
    "dramatiq[redis]>=2,<3",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16.3",
    "redis>=8.2.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "structlog>=26.1.0",
    "uuid-utils>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# the worker image only (torch CPU build from the pytorch-cpu index); the api image never installs it
ml = [
    "beat-this>=1.1.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "soundfile>=0.14.0",
    "scipy>=1.18.1",
    "transformers>=5.24.1",
    "pillow>=13.0.0",
    "scenedetect>=0.7.3",
    "opencv-python-headless>=5.1.0.95",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saveclock"]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.4",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "scenedetect>=0.7.3",
    "scipy>=1.18.1",  # the unit tests run FakeBeatModel and the DSP without the ml extra
    "soundfile>=0.14.0",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "C4", "PT", "RUF", "ASYNC", "N", "PL", "TCH", "ANN", "DTZ", "TID251"]
ignore = [
  "PLR0913",  # many keyword args are normal for service/repository signatures
  "PLR0911",  # early returns are clearer than nesting
  "PLC0415",  # lazy imports are used on purpose in the alembic env and the worker entrypoint
  "N818",  # error classes follow the plan names (NotFound, Forbidden, ...) without an Error suffix
]

# ruff 0.17 has no S614 (unsafe torch.load), so the ban is spelled out here (plan 004 Step 9)
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"torch.load".msg = "torch.load unpickles: weights are loaded by beat_this with weights_only=True"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
files = ["src", "tests", "migrations"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true  # asyncpg ships no stubs; only the tests use it directly

[[tool.mypy.overrides]]
module = ["beat_this", "beat_this.*", "soundfile", "scipy", "scipy.*", "torch", "torch.*", "transformers", "transformers.*", "scenedetect", "scenedetect.*", "cv2", "PIL", "PIL.*"]
ignore_missing_imports = true  # beat_this ships no py.typed; the ml extra is not in the dev env; transformers and scenedetect
# are untyped or absent depending on the environment

[tool.pytest.ini_options]
markers = [
  "ffmpeg: needs the pinned FFmpeg binary (make ffmpeg-bin)",
  "ml: needs torch and the model weights (make test-ml)",
  "unit: no I/O",
  "integration: needs postgres/redis/files",
  "golden: golden-file tests",
  "slow: slow tests",
  "live: hits real external services",
  "migration_roundtrip: alembic check and downgrade/upgrade, run by the migrations stage",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["saveclock"]
# SQLAlchemy's asyncio layer runs on greenlets; without this, code after the first awaited query
# in a request handler is not traced and shows as uncovered
concurrency = ["thread", "greenlet"]

[tool.importlinter]
root_package = "saveclock"
include_external_packages = true  # the domain contract forbids third-party imports

# Shared kernel (config, errors, observability, ids) and the wiring modules (main, container)
# are deliberately not listed.
[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
  "saveclock.api | saveclock.workers",
  "saveclock.services",
  "saveclock.repositories | saveclock.adapters",
  "saveclock.models",
  "saveclock.domain",
]

# The domain is pure logic: no layer above it, no framework, no I/O library (STANDARDS §1).
[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["saveclock.domain"]
forbidden_modules = [
  "saveclock.api",
  "saveclock.workers",
  "saveclock.services",
  "saveclock.repositories",
  "saveclock.adapters",
  "saveclock.models",
  "sqlalchemy",
  "fastapi",
  "httpx",
  "redis",
  "numpy",
  "scipy",
  "torch",
  "soundfile",
]

[tool.uv]
# scenedetect 0.7.3 hard-requires opencv-python (the GUI build, which bundles Qt). The headless build
# ships the same cv2 module, so the worker image swaps it in (plan 005 Step 1; judgement call).
override-dependencies = ["opencv-python ; sys_platform == 'never'", "opencv-python-headless>=4.10"]
