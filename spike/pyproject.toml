[project]
name = "spike"
version = "0.0.0"
description = "SaveClock Phase 0 validation spike"
requires-python = "==3.12.*"
dependencies = [
    "beat-this>=1.1.0",
    "mir-eval>=0.8.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spike"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["mir_eval", "mir_eval.*", "soundfile", "beat_this", "beat_this.*"]
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
